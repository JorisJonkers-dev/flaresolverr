# The repository's version is flaresolverr's own. A merge to main that changes the flaresolverr/Dockerfile
# FROM tag releases that version: it tags and releases v<version>, then publishes the image. A version already released publishes nothing, so a change that keeps the FROM
# tag ships with the next flaresolverr release.
name: Release

on:
  push:
    branches: [main]
    paths: [flaresolverr/Dockerfile]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read flaresolverr's version from the FROM line
        id: version
        run: |
          version=$(sed -n 's|^FROM flaresolverr/flaresolverr:v\([0-9]*\.[0-9]*\.[0-9]*\)@sha256:[0-9a-f]\{64\}$|\1|p' flaresolverr/Dockerfile)
          [ -n "$version" ] || { echo "::error::flaresolverr/Dockerfile names no flaresolverr/flaresolverr:vx.y.z@sha256 image"; exit 1; }
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Release the version once
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released; nothing to publish"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
            --notes "flaresolverr ${TAG#v}, hardened for the estate path. Upstream notes: https://github.com/FlareSolverr/FlareSolverr/releases/tag/$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: [tag]
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
